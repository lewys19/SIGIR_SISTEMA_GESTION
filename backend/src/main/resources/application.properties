quarkus.application.name=sigir

# --- Base de datos (en dev y test la levanta Quarkus sola en Docker) ---
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
quarkus.flyway.migrate-at-start=true

# --- JWT emitido por la propia app (RS256) ---
mp.jwt.verify.issuer=sigir
smallrye.jwt.new-token.issuer=sigir
sigir.jwt.duracion-segundos=3600
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY:/claves/publicKey.pem}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY:/claves/privateKey.pem}

# --- Administrador inicial (solo se crea si no hay usuarios) ---
sigir.admin.email=admin@sigir.pe
sigir.admin.nombre=Administrador
%dev.sigir.admin.password=Admin123!
%test.sigir.admin.password=Admin123!
%prod.sigir.admin.password=${SIGIR_ADMIN_PASSWORD}

# --- Puertos ---
%dev.quarkus.http.port=8090

# --- Redis (en dev y test lo levanta Quarkus en Docker) ---
%prod.quarkus.redis.hosts=${REDIS_URL:redis://redis:6379}
sigir.eventos.stream=sigir:eventos
